name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pdftotext for the PDF text check
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run validate
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
